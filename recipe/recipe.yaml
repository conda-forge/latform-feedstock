schema_version: 1

context:
  name: latform
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/latform-${{ version }}.tar.gz
  sha256: 7755bd3eb03b62c7e1549951dd24697872290e0ab5cfc5f1772b1b1c154abd85

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  python:
    entry_points:
      - latform = latform.main:cli_main
      - latform-apply = latform.apply:cli_main_apply
      - latform-diff = latform.diff:cli_main
      - latform-dump = latform.dump:cli_main
      - latform-gitdiff = latform.diff:cli_main_gitdiff
      - latform-graph = latform.graph:cli_main
      - latform-lint = latform.lint:cli_main
      - latform-lsp = latform.lsp:main
      - latform-template = latform.template:cli_main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - rich
    - typing_extensions
    - pyyaml
    - nmlform >=0.0.3
    # For the language server:
    - pygls >2.0
    # Technically only for older Python versions:
    - tomli

tests:
  - python:
      imports:
        - latform
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
    script:
      - latform --help
      - latform-apply --help
      - latform-diff --help
      - latform-dump --help
      - latform-gitdiff --help
      - latform-graph --help
      - latform-lint --help
      - latform-lsp --help
      - latform-template --help

about:
  summary: Bmad lattice parser/formatter tool
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/ken-lauer/latform

extra:
  recipe-maintainers:
    - ken-lauer
