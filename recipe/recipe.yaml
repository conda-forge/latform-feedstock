schema_version: 1

context:
  name: latform
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/latform-${{ version }}.tar.gz
  sha256: 545b8a212a628bff1557a3411c9096f3b43339e9b5cc64eb2d26484839d93883

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  python:
    entry_points:
      - latform = latform.main:cli_main
      - latform-graph = latform.graph:cli_main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - rich
    - typing_extensions
    - pyyaml
    - nmlform >=0.0.3
    # For the language server:
    - pygls >2.0

tests:
  - python:
      imports:
        - latform
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
    script:
      - latform --help
      - latform-apply --help
      - latform-diff --help
      - latform-dump --help
      - latform-gitdiff --help
      - latform-graph --help
      - latform-lint --help
      - latform-lsp --help
      - latform-template --help

about:
  summary: Bmad lattice parser/formatter tool
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/ken-lauer/latform

extra:
  recipe-maintainers:
    - ken-lauer
